version: "3.8"
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  evm-sandbox:
    build:
      context: ./docker/evm
    image: gaolaif/evm-sandbox:latest
    ports:
      - "8545:8545"
    command: "anvil --host 0.0.0.0 --port 8545"
    profiles:
      - evm

  move-sandbox:
    build:
      context: ./docker/move
    image: gaolaif/move-sandbox:latest
    command: "sleep infinity"
    profiles:
      - move

volumes:
  qdrant_data:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sireen-core"
version = "0.1.1"
description = "Forge-backed adversarial security workbench"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.109.0",
	"httpx>=0.26.0",
	"pydantic>=2.5.0",
	"python-dotenv==1.0.1",
	"qdrant-client>=1.9.0",
	"supabase>=2.0.0",
	"uvicorn[standard]>=0.27.0",
	"websockets>=12.0",
]

[project.scripts]
sireen = "sireen_cli:main"

[tool.setuptools]
py-modules = ["main", "session_store", "sireen_cli"]

[tool.setuptools.packages.find]
include = ["firewall*", "llm*", "memory*", "models*", "phases*", "sandbox*", "subscription*", "verification*"]
name: SIREEN Cross-Platform QA

on:
  push:
    branches:
      - main
      - "qa/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sireen-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gaolaif/backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gaolaif/extension/package-lock.json

      - name: Set up Foundry
        if: runner.os != 'Windows'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Record runner and toolchain architecture
        run: |
          python -c "import platform,sys; print('OS:',platform.platform()); print('Architecture:',platform.machine()); print('Python:',sys.version)"
          node --version
          npm --version
          if [ "${RUNNER_OS}" != "Windows" ]; then forge --version; fi
        shell: bash

      - name: Install backend dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
        working-directory: gaolaif/backend

      - name: Create test result directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"

      - name: Compile backend modules
        run: python -m compileall -q gaolaif/backend

      - name: Run backend and CLI unit/integration tests
        run: python -m pytest tests/ firewall/tests/ -v --tb=short --junitxml=../../test-results/backend-${{ matrix.os }}.xml
        working-directory: gaolaif/backend

      - name: CLI command smoke test
        run: python -m sireen_cli --help
        working-directory: gaolaif/backend
        env:
          SIREEN_QA_MARKER: cross-platform-safe

      - name: CLI exit-code and honesty smoke test
        run: |
          python -m sireen_cli audits
          python -c "import subprocess,sys; r=subprocess.run([sys.executable,'-m','sireen_cli','show','audit-does-not-exist']); sys.exit(0 if r.returncode==3 else 1)"
        working-directory: gaolaif/backend
        env:
          SIREEN_MEMORY_MODE: memory
          SIREEN_AUTH_DISABLED: "1"

      - name: API authentication smoke test
        # The token is supplied through SIREEN_API_TOKEN because the lifespan
        # hook resolves it at startup; setting the module attribute directly
        # would be overwritten when TestClient enters the lifespan.
        run: |
          python -c "
          from fastapi.testclient import TestClient
          import main
          with TestClient(main.app) as c:
              assert c.get('/health').status_code == 200, 'health must stay public'
              assert c.post('/audit/start', json={'code': 'contract C {}'}).status_code == 401, 'missing token must be rejected'
              assert c.post('/audit/start', json={'code': 'contract C { function f() public {} }'},
                            headers={'Authorization': 'Bearer ci-token'}).status_code == 200, 'valid token must be accepted'
          print('API auth smoke test passed')
          "
        working-directory: gaolaif/backend
        env:
          SIREEN_API_TOKEN: ci-token

      - name: Memory mode smoke test
        run: |
          python -c "
          import os
          os.environ['SIREEN_MEMORY_MODE'] = 'memory'
          from memory.smart_memory import SmartMemory
          m = SmartMemory(); m.init()
          m.save('k', '[ABSTRACT] reentrancy pattern')
          assert m.search('reentrancy'), 'memory mode must round-trip in process'
          os.environ['SIREEN_MEMORY_MODE'] = 'off'
          o = SmartMemory(); o.init()
          o.save('k', 'x'); assert o.search('x') == [], 'off mode must store nothing'
          print('Memory mode smoke test passed')
          "
        working-directory: gaolaif/backend

      - name: Check environment-variable handling
        run: python -c "import os; assert os.environ['SIREEN_QA_MARKER'] == 'cross-platform-safe'; print('Environment variable available')"
        working-directory: gaolaif/backend
        env:
          SIREEN_QA_MARKER: cross-platform-safe

      - name: Install extension dependencies
        run: npm ci
        working-directory: gaolaif/extension

      - name: Run extension tests
        run: npx jest --ci --runInBand --json --outputFile=../../test-results/extension-${{ matrix.os }}.json
        working-directory: gaolaif/extension

      - name: Build VS Code extension
        run: npm run package
        working-directory: gaolaif/extension

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies
        working-directory: gaolaif/extension

      - name: Run full release gate (Ubuntu)
        if: runner.os == 'Linux'
        run: python runtime_verification/verify_all.py

      - name: Upload test results and VSIX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sireen-qa-${{ matrix.os }}
          path: |
            test-results/**
            gaolaif/extension/*.vsix
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability audit (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gaolaif/backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gaolaif/extension/package-lock.json

      - name: Create dependency audit result directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python requirements
        # `pip-audit` exits non-zero when any advisory matches, which is the
        # signal we want. The JSON report is uploaded even on failure.
        run: pip-audit -r requirements.txt --format json --output ../../test-results/pip-audit.json
        working-directory: gaolaif/backend

      - name: Install extension dependencies
        run: npm ci
        working-directory: gaolaif/extension

      - name: Audit npm lockfile
        run: |
          set +e
          npm audit --audit-level=low --json > ../../test-results/npm-audit.json
          code=$?
          set -e
          python -c "import json;d=json.load(open('../../test-results/npm-audit.json'));print('npm vulnerabilities:', d.get('metadata',{}).get('vulnerabilities',{}))"
          exit $code
        working-directory: gaolaif/extension

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sireen-dependency-audit
          path: test-results/*-audit.json
          if-no-files-found: warn
          retention-days: 14

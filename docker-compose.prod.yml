# EVM/Move sandboxes are on-demand containers launched by the backend
# (sandbox/docker_runner.py, images gaolaif/evm-sandbox / move-sandbox);
# they are not long-running compose services.
services:
  backend:
    build:
      context: ./gaolaif/backend
      dockerfile: Dockerfile
    ports:
      - "7432:7432"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - NOWPAYMENTS_API_KEY=${NOWPAYMENTS_API_KEY:-}
      - NOWPAYMENTS_IPN_SECRET=${NOWPAYMENTS_IPN_SECRET:-}
      - SIREEN_BACKEND_URL=${SIREEN_BACKEND_URL:-http://localhost:7432}
    depends_on:
      - qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7432/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  qdrant_data:
